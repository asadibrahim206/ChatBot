name: Trigger auto deployment for az-container-chatbot

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ feature/llm-integration ]
    paths:
    - '**'
    - '.github/workflows/az-container-chatbot-AutoDeployTrigger-68b3aa6e-6e4b-484c-afd0-1d384785c30a.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZCONTAINERCHATBOT_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZCONTAINERCHATBOT_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZCONTAINERCHATBOT_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: azregcontainerchatbot.azurecr.io
          registryUsername: ${{ secrets.AZCONTAINERCHATBOT_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.AZCONTAINERCHATBOT_REGISTRY_PASSWORD }}
          containerAppName: az-container-chatbot
          resourceGroup: az-rg-container-chatbot
          imageToBuild: azregcontainerchatbot.azurecr.io/az-container-chatbot:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


