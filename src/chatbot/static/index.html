<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chatbot</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f3f4f6;
      display: flex;
      justify-content: center;
    }
    .chat {
      width: 100%;
      max-width: 600px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #fff;
    }
    .chat h1 {
      margin: 0;
      padding: 16px;
      font-size: 1.1rem;
      border-bottom: 1px solid #e5e7eb;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    .message.user { align-self: flex-end; background: #2563eb; color: #fff; }
    .message.bot { align-self: flex-start; background: #e5e7eb; color: #111; }
    .composer {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #e5e7eb;
    }
    #message-input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
    }
    #send-button {
      padding: 10px 18px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    #send-button:disabled { background: #93c5fd; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="chat">
    <h1>Chatbot</h1>
    <div id="messages"></div>
    <div class="composer">
      <input id="message-input" type="text" placeholder="Type a message..." autocomplete="off">
      <button id="send-button">Send</button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("message-input");
    const buttonEl = document.getElementById("send-button");

    let sessionId = sessionStorage.getItem("session_id");

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = "message " + role;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      addMessage("user", text);
      inputEl.value = "";
      buttonEl.disabled = true;

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, session_id: sessionId }),
        });
        if (!response.ok) throw new Error("Server returned " + response.status);

        const data = await response.json();
        sessionId = data.session_id;
        sessionStorage.setItem("session_id", sessionId);
        addMessage("bot", data.reply);
      } catch (error) {
        addMessage("bot", "Sorry, something went wrong. Please try again.");
      } finally {
        buttonEl.disabled = false;
        inputEl.focus();
      }
    }

    async function loadHistory() {
      if (!sessionId) return;
      const response = await fetch("/history/" + encodeURIComponent(sessionId));
      if (!response.ok) return;
      const data = await response.json();
      data.messages.forEach((m) => addMessage(m.role, m.text));
    }

    buttonEl.addEventListener("click", sendMessage);
    inputEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter") sendMessage();
    });

    loadHistory();
    inputEl.focus();
  </script>
</body>
</html>
